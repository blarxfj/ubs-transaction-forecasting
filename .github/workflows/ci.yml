name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pinned environment
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests
      - name: Unit tests
        run: uv run pytest --ignore=tests/test_determinism.py
      - name: Tiny-fixture determinism check
        run: uv run pytest tests/test_determinism.py
